<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ist es schon so weit?</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Ist der Anbau schon fertig? Antwort: NEIN.">
    <meta property="og:title" content="Ist es schon so weit?">
    <meta property="og:description" content="NEIN. Und es wird auch so schnell nicht so weit sein.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏗️</text></svg>">
    <style>
        /* Modernes Reset und Schriftart-Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        /* Container für den Inhalt */
        .container {
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* Frage-Stil */
        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #94a3b8;
            animation: fadeIn 1s ease-out;
        }

        /* Das große NEIN */
        .answer {
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #ef4444;
            text-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
            user-select: none;
            transition: transform 0.1s ease;
        }

        /* Subtext / wechselnde Sprüche */
        .subtext {
            font-size: 1.1rem;
            color: #64748b;
            min-height: 3rem;
            line-height: 1.5;
            max-width: 400px;
            transition: color 0.3s ease;
        }

        /* Interaktiver Button */
        button {
            background-color: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Kleine unauffällige Fußzeile */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.75rem;
            color: #475569;
        }

        /* Animationen */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ist der Anbau schon fertig?</h1>
        <div class="answer" id="answer">NEIN.</div>
        <p class="subtext" id="subtext" aria-live="polite">Und es wird auch so schnell nicht so weit sein.</p>
        <button id="ask-btn">Nochmal fragen</button>
    </div>

    <footer>
        Ein sehr wichtiges Projekt.
    </footer>

    <script>
        const answerEl = document.getElementById('answer');
        const subtextEl = document.getElementById('subtext');
        const buttonEl = document.getElementById('ask-btn');

        // Liste von zufälligen Antworten beim Klicken des Buttons
        const excuses = [
            "Nein, auch beim zweiten Mal Klicken nicht.",
            "Immer noch nicht. Geduld ist eine Tugend.",
            "Nö. Frag am besten in fünf Minuten nochmal. (Spoiler: Die Antwort bleibt gleich)",
            "Wirklich nicht.",
            "Vielleicht morgen. Aber heute: Definitiv nein.",
            "Nein. Und jeder Klick zögert es theoretisch nur weiter hinaus.",
            "Mach dir erst mal einen Kaffee. Das dauert noch.",
            "Dieses Jahr bestimmt nicht mehr. Vielleicht nächstes Jahr. Vielleicht.",
            "Nein. Aber frag mich nächstes Jahr nochmal – dann ist es immer noch nicht fertig.",
            "Komm Ende 2027 wieder. 2026 wird das nix mehr.",
            "Der Anbau? Ach, lass gut sein. Ich hab den Plan aufgegeben.",
            "Theoretisch: nein. Praktisch: auch nein. Zukunftsprognose: bleibt nein.",
            "Nein. Der Handwerker kommt 'nächste Woche' – seit Mitte 2025.",
            "Ich melde mich, wenn's so weit ist. Also hör auf zu fragen.",
            "Noch nicht, aber wir feiern bald das einjährige Jubiläum der Baustelle.",
            "Rom wurde auch nicht an einem Tag gebaut. Wir halten uns da streng an den historischen Zeitplan."
        ];

        let lastIndex = -1;

        buttonEl.addEventListener('click', () => {
            // Shake-Animation triggern
            answerEl.classList.remove('shake');
            // Trick, um die CSS-Animation neu zu starten
            void answerEl.offsetWidth; 
            answerEl.classList.add('shake');

            // Zufälligen Spruch auswählen (der sich nicht direkt wiederholt)
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * excuses.length);
            } while (randomIndex === lastIndex);
            
            lastIndex = randomIndex;

            // Text mit kurzem Verblassen ändern
            subtextEl.style.color = 'transparent';
            setTimeout(() => {
                subtextEl.textContent = excuses[randomIndex];
                subtextEl.style.color = '#94a3b8';
            }, 150);
        });
    </script>
</body>
</html>
