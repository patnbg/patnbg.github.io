<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown zum Kleeblatt-Kollaps</title>
  <style>
    :root {
      --bg-1: #f3f5eb;
      --bg-2: #d7dfc6;
      --ink: #1f2a1f;
      --muted: #4d5d4c;
      --accent: #667a42;
      --accent-dry: #8a6b3d;
      --card: rgba(248, 250, 241, 0.78);
      --line: rgba(53, 70, 40, 0.2);
      --glow: rgba(131, 157, 91, 0.35);
      --shadow: rgba(43, 57, 32, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      color: var(--ink);
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
      background:
        radial-gradient(1200px 800px at 90% -20%, rgba(138, 107, 61, 0.2) 0, rgba(138, 107, 61, 0) 60%),
        radial-gradient(900px 600px at 0% 100%, rgba(102, 122, 66, 0.25) 0, rgba(102, 122, 66, 0) 55%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        repeating-linear-gradient(
          45deg,
          rgba(70, 92, 52, 0.15) 0,
          rgba(70, 92, 52, 0.15) 1px,
          transparent 1px,
          transparent 10px
        );
    }

    .card {
      width: min(960px, 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: clamp(1.2rem, 3vw, 2.5rem);
      background: var(--card);
      backdrop-filter: blur(4px);
      box-shadow: 0 24px 60px -28px var(--shadow);
      position: relative;
      isolation: isolate;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 22px;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0));
      pointer-events: none;
      z-index: -1;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(190px, 0.9fr);
      gap: 1.25rem;
      align-items: center;
    }

    h1 {
      margin: 0;
      line-height: 0.95;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-wrap: balance;
    }

    .subtitle {
      margin: 0.8rem 0 0;
      max-width: 52ch;
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--muted);
    }

    .clover-shell {
      justify-self: center;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
      width: clamp(280px, 38vw, 430px);
    }

    .clover-item {
      aspect-ratio: 1 / 1;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(53, 70, 40, 0.25);
      background: rgba(252, 255, 246, 0.72);
      box-shadow: 0 16px 26px rgba(50, 67, 36, 0.2);
    }

    .clover-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: contrast(1.12) brightness(1.06) saturate(1.02);
    }

    .clover-item::before {
      content: "";
      position: absolute;
      inset: 8% 12% 10% 12%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle at 30% 20%, rgba(250, 255, 238, 0.38), rgba(250, 255, 238, 0) 54%);
      mix-blend-mode: screen;
    }

    .clover-item::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 50%;
      background-image: radial-gradient(circle at 24% 68%, rgba(116, 88, 52, 0.32) 0 6%, transparent 8%),
        radial-gradient(circle at 73% 42%, rgba(98, 77, 43, 0.25) 0 5%, transparent 7%),
        radial-gradient(circle at 53% 18%, rgba(98, 77, 43, 0.18) 0 5%, transparent 7%);
      opacity: 0.45;
      transform: rotate(-9deg);
    }

    .vein {
      stroke: rgba(236, 246, 224, 0.65);
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
    }

    .crack {
      stroke: rgba(110, 81, 46, 0.82);
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 7 6;
    }

    .rot {
      margin-top: 1.8rem;
      padding-top: 1.3rem;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 1rem;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .unit {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.45);
      border-radius: 14px;
      text-align: center;
      padding: 0.7rem 0.5rem 0.85rem;
      box-shadow: inset 0 -8px 18px rgba(122, 139, 95, 0.12);
    }

    .value {
      display: block;
      font-size: clamp(1.7rem, 4.4vw, 2.6rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--ink);
    }

    .label {
      display: block;
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .line {
      margin: 0;
      font-size: clamp(1.05rem, 2.1vw, 1.35rem);
      color: var(--accent-dry);
      min-height: 1.5em;
    }

    .status {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
    }

    .urgent .unit {
      box-shadow: inset 0 -8px 18px rgba(122, 139, 95, 0.16), 0 0 0 1px rgba(138, 107, 61, 0.12);
    }

    .end-state .clover-shell {
      filter: grayscale(0.38) saturate(0.68) drop-shadow(0 16px 26px rgba(50, 67, 36, 0.23));
    }

    .end-state .line {
      color: #6c512d;
      font-weight: 600;
    }

    .foot {
      margin-top: 1.2rem;
      font-size: 0.84rem;
      color: var(--muted);
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
    }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .clover-shell {
        order: -1;
        grid-template-columns: 1fr;
        width: min(340px, 100%);
      }
    }

    @media (max-width: 520px) {
      .countdown {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="card" id="cardRoot">
    <section class="hero">
      <div>
        <h1>Countdown zum Kleeblatt-Kollaps</h1>
        <p class="subtitle" id="statusText">Genießt die Zeit bis 22:30 Uhr.</p>
      </div>
      <div class="clover-shell" aria-hidden="true">
        <div class="clover-item">
          <img src="clover2.jpg" alt="Welkes Kleeblatt" class="clover-image">
        </div>
        <div class="clover-item">
          <img src="clover.png" alt="Kleeblatt" class="clover-image">
        </div>
      </div>
    </section>

    <section class="rot" aria-live="polite">
      <div class="countdown" role="timer" aria-label="Verbleibende Zeit bis zum Ende des Countdowns">
        <div class="unit"><span class="value" id="days">00</span><span class="label">Tage</span></div>
        <div class="unit"><span class="value" id="hours">00</span><span class="label">Stunden</span></div>
        <div class="unit"><span class="value" id="minutes">00</span><span class="label">Minuten</span></div>
        <div class="unit"><span class="value" id="seconds">00</span><span class="label">Sekunden</span></div>
      </div>

      <p class="line" id="punLine">Das Kleeblatt ist verwelkt.</p>
      <p class="foot">Alle Blumen blühen - Nur das Fürther Kleeblatt nicht.</p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var zone = "Europe/Berlin";
      var card = document.getElementById("cardRoot");
      var statusText = document.getElementById("statusText");
      var punLine = document.getElementById("punLine");
      var dayEl = document.getElementById("days");
      var hourEl = document.getElementById("hours");
      var minuteEl = document.getElementById("minutes");
      var secondEl = document.getElementById("seconds");

      var puns = [
        "Lieber Fünfter als Fürther... Fünftzehnter wäre auch nicht schlecht gewesen."
      ];

      function formatPart(date, timeZone) {
        var f = new Intl.DateTimeFormat("en-CA", {
          timeZone: timeZone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hourCycle: "h23"
        });
        var parts = f.formatToParts(date);
        var out = {};
        for (var i = 0; i < parts.length; i += 1) {
          var part = parts[i];
          if (part.type !== "literal") {
            out[part.type] = Number(part.value);
          }
        }
        return out;
      }

      function zonedTimeToUtcMs(year, month, day, hour, minute, timeZone) {
        var guess = Date.UTC(year, month - 1, day, hour, minute, 0);
        var desired = Date.UTC(year, month - 1, day, hour, minute, 0);

        for (var i = 0; i < 6; i += 1) {
          var actual = formatPart(new Date(guess), timeZone);
          var represented = Date.UTC(
            actual.year,
            actual.month - 1,
            actual.day,
            actual.hour,
            actual.minute,
            actual.second
          );
          var diff = desired - represented;
          guess += diff;
          if (Math.abs(diff) < 1000) {
            break;
          }
        }

        return guess;
      }

      function berlinTodayYmd() {
        var now = new Date();
        var b = formatPart(now, zone);
        return {
          year: b.year,
          month: b.month,
          day: b.day
        };
      }

      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      function setTime(days, hours, minutes, seconds) {
        dayEl.textContent = pad2(days);
        hourEl.textContent = pad2(hours);
        minuteEl.textContent = pad2(minutes);
        secondEl.textContent = pad2(seconds);
      }

      var targetDate = berlinTodayYmd();
      var targetMs = zonedTimeToUtcMs(targetDate.year, targetDate.month, targetDate.day, 22, 30, zone);
      var punIndex = 0;
      var timerId = null;

      function render() {
        var nowMs = Date.now();
        var diff = targetMs - nowMs;

        if (diff <= 0) {
          setTime(0, 0, 0, 0);
          card.classList.remove("urgent");
          card.classList.add("end-state");
          statusText.textContent = "Abpfiff für das Glücks-Kleeblatt. Abstieg o'clock.";
          punLine.textContent = "Endstand: drei Blätter, dritte Liga.";
          if (timerId !== null) {
            clearInterval(timerId);
          }
          return;
        }

        var totalSeconds = Math.floor(diff / 1000);
        var days = Math.floor(totalSeconds / 86400);
        var hours = Math.floor((totalSeconds % 86400) / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        setTime(days, hours, minutes, seconds);

        if (diff < 3600000) {
          card.classList.add("urgent");
        } else {
          card.classList.remove("urgent");
        }

        punLine.textContent = puns[punIndex % puns.length];
      }

      render();

      timerId = window.setInterval(function () {
        render();
      }, 1000);

      window.setInterval(function () {
        punIndex += 1;
      }, 4000);
    }());
  </script>
</body>
</html>
